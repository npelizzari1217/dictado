schema: spec-driven

project: dictado
persistence: hybrid
detected: 2026-09-08

context: |
  JS vanilla (sin framework, sin bundler, sin build, sin TypeScript) por decisión de
  arquitectura — no proponer adoptarlos. Express 4 + better-sqlite3 (síncrono) sobre
  SQLite en server/dictado.db. Node >= 24 (nvmrc: 24.20.0). Solo 3 archivos .js:
  app.js, server/db.js, server/server.js.
  Invariante de seguridad no negociable: las API keys nunca llegan al navegador;
  server/dictado.db las guarda en texto plano y está gitignoreado.
  Verificación 100% con herramientas nativas de Node: sin devDependencies, sin
  ESLint/Prettier/Jest/Vitest. package.json no debe ganar devDependencies.

strict_tdd: true

projects:
  - path: "."
    stack: "JS vanilla + Express 4 + better-sqlite3 (síncrono)"
    test_command: "npm test"
    lint_command: "npm run lint"
    verify_command: "npm run verify"
    framework: "node:test (nativo, sin dependencias)"

testing:
  strict_tdd: true
  detected: 2026-09-08
  note: >
    Hoy no existen archivos de test en el repo. La capacidad reportada es la del
    runner nativo disponible (node:test), no una suite ya escrita.
  projects:
    - path: "."
      stack: "JS vanilla + Express 4 + better-sqlite3"
      test_command: "npm test"
      framework: "node:test (nativo, Node >= 24)"
  layers:
    - path: "."
      unit: true
      unit_tool: "node:test"
      integration: true
      integration_tool: "node:test + node:http (sin librería adicional, ej. supertest)"
      e2e: false
      e2e_tool: null
  coverage:
    - path: "."
      available: true
      command: "node --test --experimental-test-coverage"
  quality:
    - path: "."
      linter: true
      linter_command: "npm run lint"
      linter_tool: "node --check (sintaxis) sobre cada .js"
      type_checker: false
      type_checker_note: "No aplica — excepción de arquitectura declarada: sin TypeScript ni build"
      formatter: false
      formatter_note: "No aplica — sin Prettier por decisión de arquitectura"

rules:
  proposal:
    - "No proponer frameworks, bundlers, build step ni TypeScript: está fuera de alcance por decisión de arquitectura documentada en CLAUDE.md."
    - No proponer ESLint, Prettier, Jest ni Vitest ni ninguna devDependency nueva.
    - "Toda propuesta que toque el manejo de API keys debe preservar el invariante: nunca llegan al navegador."
    - Incluir plan de rollback para cambios riesgosos.
  specs:
    - Usar Given/When/Then para escenarios.
    - Usar keywords RFC 2119 (MUST, SHALL, SHOULD, MAY).
  design:
    - Documentar decisiones de arquitectura con justificación.
    - Toda decisión de diseño respeta JS vanilla sin framework/bundler/build.
  tasks:
    - Agrupar por fase, numeración jerárquica.
    - Cada tarea completable en una sesión.
    - Cada unidad de trabajo incluye código, tests (*.test.js) y documentación mínima en el mismo commit.
  apply:
    guidelines:
      - Seguir los patrones existentes del código (JS plano, sin framework).
      - Tests nuevos van en *.test.js y los levanta node --test automáticamente.
      - No agregar dependencias de desarrollo ni modificar package.json para instalar herramental.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    lint_command: "npm run lint"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos.
